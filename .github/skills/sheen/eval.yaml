name: "sheen-routing"
description: "Routing evaluation — validates trigger activation for the sheen router skill."
skill: "skills/sheen/SKILL.md"
scenarios:
  - id: "pos-1"
    input: "Which Sheen agent should I use for reviewing color contrast in dark mode?"
    expect_activation: true
  - id: "pos-2"
    input: "Browse the Sheen design agent catalog and show me what's available for accessibility work"
    expect_activation: true
  - id: "pos-3"
    input: "I want to delegate this wireframing task to the right Sheen design discipline — which agent handles that?"
    expect_activation: true
  - id: "pos-4"
    input: "Find a Sheen skill that handles token naming conventions and theme inheritance"
    expect_activation: true
  - id: "pos-5"
    input: "Route my brand voice request to the correct Sheen agent"
    expect_activation: true
  - id: "neg-1"
    input: "Edit the internals of the design-debate skill to add a new pattern"
    expect_activation: false
  - id: "neg-2"
    input: "Deploy the application to Azure Container Apps and configure scaling rules"
    expect_activation: false
  - id: "neg-3"
    input: "Set up a GitHub Actions CI pipeline for building the backend service"
    expect_activation: false
