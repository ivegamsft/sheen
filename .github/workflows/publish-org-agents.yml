name: "Sheen - Publish Organization Agents"

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      SHEEN_ORG_AGENTS_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing source release tag to publish (vX.Y.Z)"
        required: true

permissions:
  contents: read

concurrency:
  group: sheen-org-agent-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.SHEEN_ORG_AGENTS_TOKEN }}
      SOURCE_TOKEN: ${{ github.token }}
      TARGET_REPO: IBuySpy-Shared/.github-private
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate publication credential and release
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$GH_TOKEN" ]] || {
            echo "::error::Configure SHEEN_ORG_AGENTS_TOKEN with Contents and Pull requests read/write on IBuySpy-Shared/.github-private only. Do not use an enterprise-owner bypass token."
            exit 1
          }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Publication requires a vX.Y.Z release tag"; exit 1;
          }
          gh api "repos/$TARGET_REPO" --jq '.permissions.push' | grep -qx true
          GH_TOKEN="$SOURCE_TOKEN" gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' | grep -qx false

      - name: Check out pinned source release
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          path: source
          persist-credentials: false

      - name: Retain trusted publication helper
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          path: tooling
          persist-credentials: false
          sparse-checkout: scripts/publish-org-agents.py
          sparse-checkout-cone-mode: false

      - name: Check out central channel
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          repository: ${{ env.TARGET_REPO }}
          token: ${{ secrets.SHEEN_ORG_AGENTS_TOKEN }}
          path: central
          persist-credentials: false

      - name: Stage owned definitions and open governed PR
        shell: bash
        run: |
          set -euo pipefail
          python tooling/scripts/publish-org-agents.py \
            --source source --target central --source-repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG"
          cd central
          git config user.name "Copilot"
          git config user.email "198982749+Copilot@users.noreply.github.com"
          git add -- agents sheen-agents-manifest.json
          if git diff --cached --quiet; then
            echo "Central channel already matches $RELEASE_TAG." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          BRANCH="chore/sheen-agents-$RELEASE_TAG"
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          EXISTING="$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            ls-remote --heads origin "refs/heads/$BRANCH")"
          if [[ -n "$EXISTING" ]]; then
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" fetch origin "$BRANCH"
            [[ "$(git write-tree)" == "$(git rev-parse 'FETCH_HEAD^{tree}')" ]] || {
              echo "::error::Existing publication branch differs; review it before retrying"; exit 1;
            }
          else
            git checkout -b "$BRANCH"
            git commit -m "chore(agents): publish Sheen $RELEASE_TAG" \
              -m "Source: $GITHUB_REPOSITORY@$RELEASE_TAG"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
              push origin "HEAD:refs/heads/$BRANCH"
          fi
          PR="$(gh pr list --repo "$TARGET_REPO" --head "$BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [[ -z "$PR" ]]; then
            PR="$(gh pr create --repo "$TARGET_REPO" --head "$BRANCH" --base main \
              --title "chore(agents): publish Sheen $RELEASE_TAG" \
              --body "Pinned definitions and ownership hashes from $GITHUB_REPOSITORY@$RELEASE_TAG. Preserves unrelated agents; modified managed files block publication. Rollback via a governed revert PR. No protection bypass or direct main push.")"
          fi
          echo "Central publication requires normal PR gates: $PR" >> "$GITHUB_STEP_SUMMARY"
