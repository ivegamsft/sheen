name: "Sheen - Docs"

# Builds the mkdocs site (strict) on PRs, and deploys it to GitHub Pages on push
# to main. Mirrors basecoat's "Deploy Docs" flow, adapted to sheen.
#
# Bootstrap: on first run the workflow calls POST /repos/{repo}/pages with the
# built-in GITHUB_TOKEN (which has pages:write on this repo) to enable GitHub
# Pages with the GitHub Actions source. Subsequent runs detect Pages is already
# enabled and skip that step.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "overrides/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "overrides/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Skip if docs not configured
        id: check
        run: |
          if [ -f mkdocs.yml ] && [ -d docs ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No mkdocs.yml/docs yet - skipping docs build."
          fi

      - name: Set up Python
        if: steps.check.outputs.configured == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.x"

      - name: Build mkdocs site (strict)
        if: steps.check.outputs.configured == 'true'
        run: |
          pip install mkdocs mkdocs-material mkdocs-awesome-pages-plugin
          mkdocs build --strict

      - name: Upload Pages artifact
        if: steps.check.outputs.configured == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@98ef48e41587a300b82de4cf298aa98b57b2faae # v4
        with:
          path: site/

  bootstrap-pages:
    # Enable GitHub Pages (GitHub Actions source) on first deployment.
    # GITHUB_TOKEN has pages:write on this repo, so this works without any PAT.
    # Runs only on push to main / manual dispatch, not on PRs.
    if: github.event_name != 'pull_request' && needs.build-docs.outputs.configured == 'true'
    needs: build-docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable GitHub Pages if not already enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pages_status=$(gh api "repos/${{ github.repository }}/pages" \
            -H "Accept: application/vnd.github+json" \
            --silent -i 2>&1 | grep -m1 "^HTTP" | awk '{print $2}' || echo "000")

          if [ "$pages_status" = "200" ]; then
            echo "GitHub Pages already enabled — skipping bootstrap."
          else
            echo "Enabling GitHub Pages with GitHub Actions source..."
            enable_status=$(gh api -X POST "repos/${{ github.repository }}/pages" \
              -H "Accept: application/vnd.github+json" \
              -f build_type=workflow \
              --silent -i 2>&1 | grep -m1 "^HTTP" | awk '{print $2}' || echo "000")
            if [ "$enable_status" = "201" ] || [ "$enable_status" = "409" ]; then
              echo "GitHub Pages enabled successfully (HTTP ${enable_status})."
            else
              echo "::warning::Pages bootstrap returned HTTP ${enable_status}. If Pages is not yet enabled, visit: https://github.com/${{ github.repository }}/settings/pages"
            fi
          fi

      - name: Verify github-pages environment allows this deployment branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          DEPLOY_BRANCH="${{ github.ref_name }}"
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"

          ENV_PAYLOAD="$(gh api "repos/${{ github.repository }}/environments/github-pages" 2>/dev/null || true)"
          if [[ -z "$ENV_PAYLOAD" ]]; then
            echo "::notice::Environment 'github-pages' is not yet configured. GitHub may create it automatically on first deployment."
            exit 0
          fi

          CUSTOM_POLICY="$(echo "$ENV_PAYLOAD" | jq -r '.deployment_branch_policy.custom_branch_policies // false')"
          PROTECTED_ONLY="$(echo "$ENV_PAYLOAD" | jq -r '.deployment_branch_policy.protected_branches // false')"

          if [[ "$CUSTOM_POLICY" == "true" ]]; then
            BRANCHES="$(gh api "repos/${{ github.repository }}/environments/github-pages/deployment-branch-policies" \
              --jq '.branch_policies[].name' 2>/dev/null || true)"
            if ! echo "$BRANCHES" | grep -Fqx "$DEPLOY_BRANCH"; then
              echo "::error::Environment 'github-pages' allows selected branches, but '${DEPLOY_BRANCH}' is not included."
              echo "Add '${DEPLOY_BRANCH}' at: https://github.com/${{ github.repository }}/settings/environments"
              exit 1
            fi
          elif [[ "$PROTECTED_ONLY" != "true" ]]; then
            echo "::notice::No branch restrictions on github-pages environment."
          fi

          echo "github-pages environment policy permits deployments from ${DEPLOY_BRANCH}."

  deploy:
    # Publish only on push to main / manual dispatch; PRs validate the build only.
    if: github.event_name != 'pull_request' && needs.build-docs.outputs.configured == 'true'
    needs: [build-docs, bootstrap-pages]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v4

      - name: Update repository homepage URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          gh api --method PATCH "repos/${{ github.repository }}" \
            -f homepage="https://${OWNER}.github.io/${REPO}/" 2>/dev/null \
            && echo "Homepage URL updated." \
            || echo "Warning: could not update homepage URL (non-fatal)."
