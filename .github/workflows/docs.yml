name: "Sheen - Docs"

# Builds the mkdocs site (strict) on PRs, and deploys it to GitHub Pages on push
# to main. Mirrors basecoat's "Deploy Docs" flow (its .github/ is excluded from
# vendor/), adapted to sheen: no basecoat-only inventory/scorecard generators, and
# mkdocs.yml already carries this repo's site_url/repo_url.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "overrides/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "overrides/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Skip if docs not configured
        id: check
        run: |
          if [ -f mkdocs.yml ] && [ -d docs ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No mkdocs.yml/docs yet - skipping docs build."
          fi

      - name: Set up Python
        if: steps.check.outputs.configured == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.x"

      - name: Build mkdocs site (strict)
        if: steps.check.outputs.configured == 'true'
        run: |
          pip install mkdocs mkdocs-material
          mkdocs build --strict

      - name: Upload Pages artifact
        if: steps.check.outputs.configured == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@98ef48e41587a300b82de4cf298aa98b57b2faae # v4
        with:
          path: site/

  deploy:
    # Publish only on push to main / manual dispatch; PRs validate the build only.
    if: github.event_name != 'pull_request' && needs.build-docs.outputs.configured == 'true'
    needs: build-docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v4
