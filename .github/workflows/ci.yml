name: "Sheen - CI"

# Solo-dev workflow pack (see .github/sheen-onboarding-profile.json).
# Validates sheen assets at the repo root. NEVER scans vendor/ (read-only,
# validated upstream). All steps no-op gracefully until assets land.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Lint - skill folders have SKILL.md and matching name
        run: |
          status=0
          if [ -d skills ]; then
            for dir in skills/*/; do
              [ -d "$dir" ] || continue
              name="$(basename "$dir")"
              if [ ! -f "${dir}SKILL.md" ]; then
                echo "::error::Skill '${name}' is missing SKILL.md"; status=1; continue
              fi
              if ! grep -qE "^name:[[:space:]]*${name}[[:space:]]*$" "${dir}SKILL.md"; then
                echo "::error file=${dir}SKILL.md::frontmatter 'name' must equal folder '${name}'"; status=1
              fi
              if [ ! -f "${dir}eval.yaml" ]; then
                echo "::warning::Skill '${name}' has no eval.yaml"
              fi
            done
          else
            echo "No skills/ directory yet - skipping (expected pre-implementation)."
          fi
          exit $status

      - name: Lint - agent frontmatter present
        run: |
          status=0
          if [ -d agents ]; then
            while IFS= read -r file; do
              if [ "$(sed -n '1p' "$file")" != "---" ]; then
                echo "::error file=${file}::Missing YAML frontmatter opening '---'"; status=1; continue
              fi
              if ! sed -n '2,30p' "$file" | grep -qxF -- '---'; then
                echo "::error file=${file}::Missing YAML frontmatter closing '---' within first 30 lines"; status=1; continue
              fi
              if ! sed -n '1,30p' "$file" | grep -qi '^description:'; then
                echo "::error file=${file}::Missing 'description' in frontmatter"; status=1
              fi
            done < <(find agents -type f -name '*.agent.md' | sort)
          else
            echo "No agents/ directory yet - skipping."
          fi
          exit $status

      - name: Lint - instruction naming convention
        run: |
          status=0
          if [ -d instructions ]; then
            while IFS= read -r file; do
              base="$(basename "$file")"
              [ "$base" = "README.md" ] && continue
              if [[ ! "$base" =~ ^sheen-[0-9]{2}-[a-z0-9-]+\.instructions\.md$ ]]; then
                echo "::error file=${file}::Must match 'sheen-<NN>-<topic>.instructions.md'"; status=1
              fi
            done < <(find instructions -maxdepth 1 -type f -name '*.md' | sort)
          else
            echo "No instructions/ directory yet - skipping."
          fi
          exit $status

      - name: Validate - skills/_catalog.md references exist on disk
        run: |
          status=0
          if [ -f skills/_catalog.md ]; then
            refs=$(grep -oE '`skills/[^`]+`' skills/_catalog.md | tr -d '`' | sort -u || true)
            for ref in $refs; do
              if [[ "$ref" == */ ]]; then
                [ -d "${ref%/}" ] || { echo "::error file=skills/_catalog.md::Missing dir '$ref'"; status=1; }
              else
                [ -f "$ref" ] || { echo "::error file=skills/_catalog.md::Missing file '$ref'"; status=1; }
              fi
            done
          else
            echo "No skills/_catalog.md yet - skipping."
          fi
          exit $status

      - name: Guard - vendor/ must not be scanned by sheen assets
        run: |
          # vendor/ is read-only; fail if a root asset dir accidentally nests under vendor.
          if find vendor -maxdepth 2 -type d \( -name skills -o -name agents -o -name instructions \) 2>/dev/null | grep -q vendor; then
            echo "vendor/basecoat carries its own assets - this is expected and excluded from sheen scans."
          fi
          echo "OK"

      - name: Install PowerShell (lint job)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq powershell

      - name: Lint - frontmatter contracts
        run: pwsh -NonInteractive -File scripts/lint-frontmatter.ps1

      - name: Validate - metadata drift
        run: pwsh -NonInteractive -File scripts/build-metadata.ps1 -Check

  eval-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Install PowerShell
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq powershell

      - name: Validate - eval routing specificity
        run: pwsh -NonInteractive -File scripts/test-eval-routing.ps1

  tokens:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Validate - design tokens (DTCG JSON)
        run: |
          if [ ! -d tokens ]; then
            echo "No tokens/ directory yet - skipping (Phase 1)."
            exit 0
          fi
          status=0
          while IFS= read -r f; do
            if ! jq empty "$f" 2>/dev/null; then
              echo "::error file=${f}::Invalid JSON"; status=1
            fi
          done < <(find tokens -type f -name '*.json' | sort)
          echo "Token JSON validated. (Reference resolution, naming, and WCAG"
          echo "contrast gates are enforced by scripts/validate-tokens once implemented - spec 01/05.)"
          exit $status

      - name: Install PowerShell
        if: ${{ hashFiles('tokens/**/*.tokens.json') != '' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq powershell

      - name: Validate - tokens (DTCG schema, references, contrast gate)
        if: ${{ hashFiles('tokens/**/*.tokens.json') != '' }}
        run: pwsh -NonInteractive -File scripts/validate-tokens.ps1 tokens

      - name: Build - tokens (DTCG → CSS/JS/TS, spec 01 §4)
        if: ${{ hashFiles('tokens/**/*.tokens.json') != '' }}
        run: pwsh -NonInteractive -File scripts/build-tokens.ps1 -Quiet

      - name: Build - diagram skins (DTCG → semantic-role skins, #116)
        if: ${{ hashFiles('tokens/**/*.tokens.json') != '' }}
        run: pwsh -NonInteractive -File scripts/build-diagram-skins.ps1 -Quiet

      - name: Build - icons (vendored subset → dist/icons, #111)
        if: ${{ hashFiles('vendor/tabler-icons/**') != '' }}
        run: pwsh -NonInteractive -File scripts/build-icons.ps1

      - name: Verify - icon build is reproducible (#111)
        if: ${{ hashFiles('vendor/tabler-icons/**') != '' }}
        run: |
          cp dist/icons/manifest.json /tmp/manifest-first.json
          rm -rf dist/icons
          pwsh -NonInteractive -File scripts/build-icons.ps1
          if ! diff -q /tmp/manifest-first.json dist/icons/manifest.json > /dev/null; then
            echo "::error::dist/icons/manifest.json differs between two consecutive builds — build-icons.ps1 is not reproducible"
            exit 1
          fi
          echo "build-icons.ps1 reproducible: two consecutive builds produced an identical manifest."

      - name: Lint - diagram skins (skin, polarity, contrast gates, #118)
        if: ${{ hashFiles('tokens/**/*.tokens.json') != '' }}
        run: pwsh -NonInteractive -File scripts/lint-diagram-skins.ps1

      - name: Render - documentation diagrams, all 16 included types (#113)
        if: ${{ hashFiles('tokens/**/*.tokens.json') != '' && hashFiles('vendor/tabler-icons/**') != '' }}
        run: |
          set -e
          mkdir -p /tmp/documentation-diagram-out
          for f in skills/documentation-diagram/samples/*.json; do
            name=$(basename "$f" .json)
            pwsh -NonInteractive -File scripts/render-diagram.ps1 \
              -Type "$name" \
              -SpecPath "$f" \
              -OutPath "/tmp/documentation-diagram-out/${name}.html" \
              -Theme light
          done

      - name: Lint - documentation diagram output (geometry + anti-slop, #113)
        if: ${{ hashFiles('tokens/**/*.tokens.json') != '' && hashFiles('vendor/tabler-icons/**') != '' }}
        run: |
          status=0
          for f in skills/documentation-diagram/samples/*.json; do
            name=$(basename "$f" .json)
            svg="/tmp/documentation-diagram-out/${name}.svg"
            grep -Pzo '(?s)<svg.*?</svg>' "/tmp/documentation-diagram-out/${name}.html" | tr -d '\0' > "$svg"
            if ! pwsh -NonInteractive -File scripts/lint-diagram-geometry.ps1 -SvgPath "$svg" -Quiet; then
              echo "::error::documentation-diagram '${name}' failed lint-diagram-geometry.ps1"
              status=1
            fi
            if ! pwsh -NonInteractive -File scripts/audit-diagram-slop.ps1 -SvgPath "$svg" -Theme light -Quiet; then
              echo "::error::documentation-diagram '${name}' failed audit-diagram-slop.ps1"
              status=1
            fi
          done
          exit $status

      - name: Lint - diagram geometry (connector/label rules, #118)
        run: |
          pwsh -NonInteractive -File scripts/lint-diagram-geometry.ps1 -SvgPath tests/fixtures/diagrams/baseline.svg
          if pwsh -NonInteractive -File scripts/lint-diagram-geometry.ps1 -SvgPath tests/fixtures/diagrams/broken.svg; then
            echo "::error::lint-diagram-geometry.ps1 passed the intentionally-broken fixture — geometry lint is not catching known violations"
            exit 1
          else
            echo "broken.svg correctly failed geometry lint."
          fi

      - name: Audit - diagram anti-slop rules (design-audit, #115)
        if: ${{ hashFiles('tokens/**/*.tokens.json') != '' }}
        run: |
          pwsh -NonInteractive -File scripts/audit-diagram-slop.ps1 -SvgPath tests/fixtures/diagrams/clean-sample.svg -Theme light
          if pwsh -NonInteractive -File scripts/audit-diagram-slop.ps1 -SvgPath tests/fixtures/diagrams/broken-sample.svg -Theme light; then
            echo "::error::audit-diagram-slop.ps1 passed the intentionally-broken fixture — anti-slop audit is not catching known violations"
            exit 1
          else
            echo "broken-sample.svg correctly failed the anti-slop audit."
          fi

      - name: Verify - system atlas docs page is up to date (#149)
        if: ${{ hashFiles('tokens/**/*.tokens.json') != '' && hashFiles('vendor/tabler-icons/**') != '' }}
        run: pwsh -NonInteractive -File scripts/build-system-atlas.ps1 -Check

  visual-regression:
    # Real pixel-level regression on top of the geometry/anti-slop lints
    # above (#129). Runs inside the official Playwright container so
    # Chromium's font/rendering stack exactly matches the environment the
    # committed baselines (tests/visual-regression/*-snapshots/) were
    # generated in — see skills/visual-regression/SKILL.md.
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-jammy
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Install PowerShell
        run: |
          apt-get update -qq
          apt-get install -y -qq wget apt-transport-https software-properties-common
          wget -q https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb -O /tmp/packages-microsoft-prod.deb
          dpkg -i /tmp/packages-microsoft-prod.deb
          apt-get update -qq
          apt-get install -y -qq powershell

      - name: Install - node dependencies (Playwright)
        run: npm ci

      - name: Build - tokens, diagram skins, icons (prerequisites, #113/#116/#111)
        run: |
          pwsh -NonInteractive -File scripts/build-tokens.ps1 -Quiet
          pwsh -NonInteractive -File scripts/build-diagram-skins.ps1 -Quiet
          pwsh -NonInteractive -File scripts/build-icons.ps1

      - name: Render - all documentation-diagram samples (#129)
        run: pwsh -NonInteractive -File scripts/render-all-diagram-samples.ps1

      - name: Test - visual regression (Playwright screenshot diff, #129)
        run: npx playwright test

      - name: Verify - visual regression catches a real pixel change (#129)
        run: |
          set -e
          cp dist/documentation-diagram-out/bar.html /tmp/bar-good.html
          sed -i 's/<svg/<svg style="filter:invert(1)"/' dist/documentation-diagram-out/bar.html
          if npx playwright test diagrams.spec.js -g bar; then
            echo "::error::visual-regression suite passed against an intentionally-corrupted render — the pixel diff is not catching known changes"
            exit 1
          else
            echo "Intentionally-inverted bar.html correctly failed the visual-regression diff."
          fi
          cp /tmp/bar-good.html dist/documentation-diagram-out/bar.html

      - name: Upload - Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  skills-agents-audit:
    # Unified skills/agents structural audit (#131): cross-checks catalog
    # completeness (both directions), agent composes.skills/instructions
    # refs, skill "Delegates / pairs with" refs, and wraps lint-router.ps1 +
    # audit-evals.ps1 (previously referenced only in publish-to-production.yml's
    # strip-list and never actually executed as a gate). Validate-only here —
    # findings are turned into tracked issues by the separate scheduled
    # audit-skills-agents.yml workflow, not on every PR.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Install PowerShell
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq powershell

      - name: Audit - skills/agents structural integrity (#131)
        run: pwsh -NonInteractive -File scripts/audit-skills-agents.ps1

      - name: Verify - audit catches a real broken catalog reference (#131)
        run: |
          set -e
          cp skills/_catalog.md /tmp/catalog-good.md
          grep -v 'skills/wireframing/' skills/_catalog.md > /tmp/catalog-broken.md
          mv /tmp/catalog-broken.md skills/_catalog.md
          if pwsh -NonInteractive -File scripts/audit-skills-agents.ps1 -OutFile '' -Quiet; then
            echo "::error::audit-skills-agents.ps1 passed against an intentionally-broken catalog — catalog-drift detection is not catching known violations"
            exit 1
          else
            echo "Intentionally-broken skills/_catalog.md correctly failed the audit."
          fi
          mv /tmp/catalog-good.md skills/_catalog.md

      - name: Upload - findings report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skills-agents-findings
          path: dist/audit/skills-agents-findings.json
          retention-days: 7
