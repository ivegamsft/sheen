name: "Sheen - CI"

# Solo-dev workflow pack (see .github/sheen-onboarding-profile.json).
# Validates sheen assets at the repo root. NEVER scans vendor/ (read-only,
# validated upstream). All steps no-op gracefully until assets land.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Lint - skill folders have SKILL.md and matching name
        run: |
          status=0
          if [ -d skills ]; then
            for dir in skills/*/; do
              [ -d "$dir" ] || continue
              name="$(basename "$dir")"
              if [ ! -f "${dir}SKILL.md" ]; then
                echo "::error::Skill '${name}' is missing SKILL.md"; status=1; continue
              fi
              if ! grep -qE "^name:[[:space:]]*${name}[[:space:]]*$" "${dir}SKILL.md"; then
                echo "::error file=${dir}SKILL.md::frontmatter 'name' must equal folder '${name}'"; status=1
              fi
              if [ ! -f "${dir}eval.yaml" ]; then
                echo "::warning::Skill '${name}' has no eval.yaml"
              fi
            done
          else
            echo "No skills/ directory yet - skipping (expected pre-implementation)."
          fi
          exit $status

      - name: Lint - agent frontmatter present
        run: |
          status=0
          if [ -d agents ]; then
            while IFS= read -r file; do
              if [ "$(sed -n '1p' "$file")" != "---" ]; then
                echo "::error file=${file}::Missing YAML frontmatter opening '---'"; status=1; continue
              fi
              if ! sed -n '2,30p' "$file" | grep -qxF -- '---'; then
                echo "::error file=${file}::Missing YAML frontmatter closing '---' within first 30 lines"; status=1; continue
              fi
              if ! sed -n '1,30p' "$file" | grep -qi '^description:'; then
                echo "::error file=${file}::Missing 'description' in frontmatter"; status=1
              fi
            done < <(find agents -type f -name '*.agent.md' | sort)
          else
            echo "No agents/ directory yet - skipping."
          fi
          exit $status

      - name: Lint - instruction naming convention
        run: |
          status=0
          if [ -d instructions ]; then
            while IFS= read -r file; do
              base="$(basename "$file")"
              [ "$base" = "README.md" ] && continue
              if [[ ! "$base" =~ ^sheen-[0-9]{2}-[a-z0-9-]+\.instructions\.md$ ]]; then
                echo "::error file=${file}::Must match 'sheen-<NN>-<topic>.instructions.md'"; status=1
              fi
            done < <(find instructions -maxdepth 1 -type f -name '*.md' | sort)
          else
            echo "No instructions/ directory yet - skipping."
          fi
          exit $status

      - name: Validate - skills/_catalog.md references exist on disk
        run: |
          status=0
          if [ -f skills/_catalog.md ]; then
            refs=$(grep -oE '`skills/[^`]+`' skills/_catalog.md | tr -d '`' | sort -u || true)
            for ref in $refs; do
              if [[ "$ref" == */ ]]; then
                [ -d "${ref%/}" ] || { echo "::error file=skills/_catalog.md::Missing dir '$ref'"; status=1; }
              else
                [ -f "$ref" ] || { echo "::error file=skills/_catalog.md::Missing file '$ref'"; status=1; }
              fi
            done
          else
            echo "No skills/_catalog.md yet - skipping."
          fi
          exit $status

      - name: Guard - vendor/ must not be scanned by sheen assets
        run: |
          # vendor/ is read-only; fail if a root asset dir accidentally nests under vendor.
          if find vendor -maxdepth 2 -type d \( -name skills -o -name agents -o -name instructions \) 2>/dev/null | grep -q vendor; then
            echo "vendor/basecoat carries its own assets - this is expected and excluded from sheen scans."
          fi
          echo "OK"

      - name: Install PowerShell (lint job)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq powershell

      - name: Lint - frontmatter contracts
        run: pwsh -NonInteractive -File scripts/lint-frontmatter.ps1

      - name: Validate - metadata drift
        run: pwsh -NonInteractive -File scripts/build-metadata.ps1 -Check

  eval-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Install PowerShell
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq powershell

      - name: Validate - eval routing specificity
        run: pwsh -NonInteractive -File scripts/test-eval-routing.ps1

  tokens:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Validate - design tokens (DTCG JSON)
        run: |
          if [ ! -d tokens ]; then
            echo "No tokens/ directory yet - skipping (Phase 1)."
            exit 0
          fi
          status=0
          while IFS= read -r f; do
            if ! jq empty "$f" 2>/dev/null; then
              echo "::error file=${f}::Invalid JSON"; status=1
            fi
          done < <(find tokens -type f -name '*.json' | sort)
          echo "Token JSON validated. (Reference resolution, naming, and WCAG"
          echo "contrast gates are enforced by scripts/validate-tokens once implemented - spec 01/05.)"
          exit $status

      - name: Install PowerShell
        if: ${{ hashFiles('tokens/**/*.tokens.json') != '' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq powershell

      - name: Validate - tokens (DTCG schema, references, contrast gate)
        if: ${{ hashFiles('tokens/**/*.tokens.json') != '' }}
        run: pwsh -NonInteractive -File scripts/validate-tokens.ps1 tokens

      - name: Build - tokens (DTCG → CSS/JS/TS, spec 01 §4)
        if: ${{ hashFiles('tokens/**/*.tokens.json') != '' }}
        run: pwsh -NonInteractive -File scripts/build-tokens.ps1 -Quiet

      - name: Build - diagram skins (DTCG → semantic-role skins, #116)
        if: ${{ hashFiles('tokens/**/*.tokens.json') != '' }}
        run: pwsh -NonInteractive -File scripts/build-diagram-skins.ps1 -Quiet
