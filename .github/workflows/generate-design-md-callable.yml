name: Generate DESIGN.md (Callable)

# Reusable callable workflow — mirror of check-sheen-version-callable.yml
# Checks out a consumer repo, runs build-design-md.sh to generate DESIGN.md
# from the repo's sheen/tokens/, then opens a PR with the result.
#
# Consumer repos can also call this directly via workflow_dispatch.
# To add to a consumer:
#   gh workflow run generate-design-md-callable.yml \
#     --repo IBuySpy-Shared/basecoat-sheen \
#     --field target_repo=<owner/repo>

on:
  workflow_call:
    inputs:
      target_repo:
        description: "Consumer repo (owner/repo) to generate DESIGN.md for"
        required: false
        type: string
        default: ""
      theme:
        description: "Token theme to use (default: light)"
        required: false
        type: string
        default: "light"
      sheen_ref:
        description: "Sheen ref to pull build-design-md.sh from"
        required: false
        type: string
        default: "main"
      branch:
        description: "Branch to open the PR against"
        required: false
        type: string
        default: "main"
    secrets:
      token:
        description: "PAT or App token with contents:write and pull-requests:write on the target repo"
        required: false

  workflow_dispatch:
    inputs:
      target_repo:
        description: "Consumer repo (owner/repo). Leave blank to run on this repo."
        required: false
        default: ""
      theme:
        description: "Token theme (light / dark / high-contrast)"
        required: false
        default: "light"
      sheen_ref:
        description: "Sheen ref to pull build-design-md.sh from"
        required: false
        default: "main"
      branch:
        description: "Base branch in the consumer repo"
        required: false
        default: "main"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Resolve target repo
        id: resolve
        run: |
          TARGET="${{ inputs.target_repo }}"
          if [ -z "$TARGET" ]; then
            TARGET="${{ github.repository }}"
          fi
          echo "repo=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Checkout consumer repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          repository: ${{ steps.resolve.outputs.repo }}
          token: ${{ secrets.token || secrets.GITHUB_TOKEN }}
          ref: ${{ inputs.branch || 'main' }}

      - name: Download build-design-md.sh from sheen
        env:
          # Reading scripts/build-design-md.sh from IBuySpy-Shared/basecoat-sheen via
          # raw.githubusercontent.com requires an authenticated request because the
          # source repo is private/internal — raw.githubusercontent.com 404s on an
          # unauthenticated request to a private repo instead of returning 401/403.
          # `secrets.token` (workflow_call) or `github.token` (same-repo workflow_dispatch)
          # covers the common case. Cross-repo `workflow_dispatch` callers targeting a
          # different consumer repo must supply `secrets.token` with read access to
          # IBuySpy-Shared/basecoat-sheen (same requirement as SHEEN_FETCH_TOKEN in
          # check-sheen-version-callable.yml).
          FETCH_TOKEN: ${{ secrets.token || github.token }}
        run: |
          curl -fsSL \
            -H "Authorization: token ${FETCH_TOKEN}" \
            "https://raw.githubusercontent.com/IBuySpy-Shared/basecoat-sheen/${{ inputs.sheen_ref || 'main' }}/scripts/build-design-md.sh" \
            -o /tmp/build-design-md.sh
          chmod +x /tmp/build-design-md.sh

      - name: Check for sheen tokens
        id: check_tokens
        run: |
          if [ -d "sheen/tokens" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No sheen/tokens/ directory found in ${{ steps.resolve.outputs.repo }}. Run sheen sync first."
          fi

      - name: Generate DESIGN.md
        if: steps.check_tokens.outputs.found == 'true'
        run: |
          bash /tmp/build-design-md.sh \
            --theme "${{ inputs.theme || 'light' }}" \
            --out DESIGN.md
          echo "--- DESIGN.md preview (first 40 lines) ---"
          head -40 DESIGN.md

      - name: Check for changes
        if: steps.check_tokens.outputs.found == 'true'
        id: changes
        run: |
          if git diff --quiet DESIGN.md 2>/dev/null && git ls-files --others --exclude-standard DESIGN.md | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet DESIGN.md 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "DESIGN.md is already up to date — no PR needed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR branch and open pull request
        if: steps.check_tokens.outputs.found == 'true' && steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.token || secrets.GITHUB_TOKEN }}
          REPO: ${{ steps.resolve.outputs.repo }}
          BASE: ${{ inputs.branch || 'main' }}
          THEME: ${{ inputs.theme || 'light' }}
        run: |
          PR_BRANCH="sheen/generate-design-md-$(date +%Y%m%d)"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$PR_BRANCH"
          git add DESIGN.md
          git commit -m "chore: generate DESIGN.md from sheen tokens (theme: $THEME)"
          git push origin "$PR_BRANCH"

          BODY_FILE="$(mktemp)"
          {
            echo "## DESIGN.md Generation"
            echo ""
            echo "This PR adds \`DESIGN.md\` generated from your sheen design tokens."
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Theme | \`$THEME\` |"
            echo "| Source | \`sheen/tokens/\` |"
            echo "| Generator | \`scripts/build-design-md.sh\` |"
            echo "| Sheen ref | \`${{ inputs.sheen_ref || 'main' }}\` |"
            echo ""
            echo "### What is DESIGN.md?"
            echo ""
            echo "\`DESIGN.md\` is a [Stitch-compatible](https://stitch.withgoogle.com/docs/design-md) design system spec that Copilot agents and other AI tools read as a single authoritative source of truth for your design tokens (colors, typography, spacing, radii)."
            echo ""
            echo "### Next steps"
            echo ""
            echo "1. Review the generated file"
            echo "2. Optionally add a custom intro section under the \`## Overview\` heading"
            echo "3. Merge this PR"
            echo "4. Add \`generate_design_md: true\` to your \`.sheen.yml\` so future syncs keep it current"
            echo ""
            echo "---"
            echo "_Generated by [basecoat-sheen](https://github.com/IBuySpy-Shared/basecoat-sheen) \`generate-design-md-callable.yml\`_"
          } > "$BODY_FILE"

          gh pr create \
            --repo "$REPO" \
            --base "$BASE" \
            --head "$PR_BRANCH" \
            --title "chore: generate DESIGN.md from sheen tokens" \
            --body-file "$BODY_FILE"

          echo "::notice::PR opened in $REPO"

      - name: No-op summary
        if: steps.check_tokens.outputs.found == 'false'
        run: |
          echo "::error::Cannot generate DESIGN.md — no sheen/tokens/ in ${{ steps.resolve.outputs.repo }}. Integrate sheen first: https://ibuyspy-shared.github.io/basecoat-sheen/guides/consumer-lifecycle/"
