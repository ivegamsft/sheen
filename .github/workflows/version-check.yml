name: "Sheen - Version Consistency Check"

# Mirrors basecoat's version-consistency gate (vendor/basecoat is excluded, so the
# upstream .github/ is not vendored — this is ported and adapted to sheen's
# Keep a Changelog heading style: "## [X.Y.Z] — YYYY-MM-DD".

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Validate version.json matches latest CHANGELOG entry
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          version_file = Path('version.json')
          changelog_file = Path('CHANGELOG.md')

          if not version_file.exists():
              print('::error::version.json not found at repository root')
              sys.exit(1)
          if not changelog_file.exists():
              print('::error::CHANGELOG.md not found at repository root')
              sys.exit(1)

          raw = version_file.read_text(encoding='utf-8')

          # Guard against duplicate object keys (json.loads silently keeps the
          # last one — that masked a 0.3.0/0.4.0 mismatch in the past).
          if len(re.findall(r'^\s*"version"\s*:', raw, flags=re.MULTILINE)) > 1:
              print('::error::version.json contains more than one "version" key')
              sys.exit(1)

          try:
              version_data = json.loads(raw)
          except Exception as exc:
              print(f'::error::Failed to parse version.json: {exc}')
              sys.exit(1)

          version = str(version_data.get('version', '')).strip()
          if not version:
              print('::error::version.json is missing a non-empty "version" field')
              sys.exit(1)

          changelog_text = changelog_file.read_text(encoding='utf-8')

          # Accept "## [X.Y.Z] — date" (sheen / Keep a Changelog) and
          # "## X.Y.Z - date" / "## vX.Y.Z" (basecoat), skipping [Unreleased].
          changelog_version = None
          for line in changelog_text.splitlines():
              m = re.match(r'^##\s+\[?v?(\d+\.\d+\.\d+)\]?\b', line)
              if m:
                  changelog_version = m.group(1)
                  break

          if not changelog_version:
              print('::error::Unable to find a released version heading in '
                    'CHANGELOG.md (expected "## [X.Y.Z] — YYYY-MM-DD")')
              sys.exit(1)

          if version != changelog_version:
              print(f'::error::version.json ({version}) does not match the latest '
                    f'CHANGELOG.md entry ({changelog_version}). Keep them in sync.')
              sys.exit(1)

          print(f'Version consistency check passed: {version}')
          PY
