name: "Sheen - Consumer Sync"

# Reusable callable workflow: consumer repos reference this from their own
# scheduled / dispatched workflow to auto-sync sheen assets and open a PR
# when a new version is available. Mirrors the basecoat consumer-update model.
#
# Consumer repos call this workflow like:
#
#   jobs:
#     sync:
#       uses: IBuySpy-Shared/basecoat-sheen/.github/workflows/check-sheen-version-callable.yml@<commit-sha>
#       with:
#         source_repo: ivegamsft/sheen # optional; .sheen.yml source is used when omitted
#         source_ref: main             # optional; .sheen.yml ref is used when omitted
#       secrets:
#         update_token: ${{ secrets.SHEEN_UPDATE_TOKEN }}
#         fetch_token: ${{ secrets.SHEEN_FETCH_TOKEN }} # only for private/internal source overrides
#
# This workflow is hosted ONLY in the internal repo. The public ivegamsft/sheen
# mirror serves docs and bootstrap assets and does not contain it, so a `uses:`
# pointing at the mirror cannot resolve and the run fails with zero jobs.

on:
  workflow_call:
    inputs:
      source_repo:
        description: >-
          Source sheen repository (owner/repo). Defaults to the public mirror
          after .sheen.yml is evaluated, so scheduled consumer sync does not
          require private-source credentials.
        type: string
        default: ""
      source_ref:
        description: >-
          Git ref to sync from (tag, branch, or SHA). Use 'main' for latest
          or pin to a release tag (e.g. 'v0.8.2') for stability.
        type: string
        default: ""
      pr_branch_prefix:
        description: Prefix for the sync PR branch name.
        type: string
        default: chore/sheen-update
      auto_merge:
        description: >-
          Enable auto-merge on the sync PR (requires branch protection
          auto-merge enabled on the consumer repo).
        type: boolean
        default: false
      commit_message:
        description: Commit message used in the sync PR.
        type: string
        default: ""
    secrets:
      update_token:
        description: >-
          GitHub token or PAT with contents:write and pull-requests:write
          on the consumer repo. Defaults to the workflow GITHUB_TOKEN.
        required: false
      fetch_token:
        description: >-
          Read token for private/internal source_repo overrides. Not required
          for the default public ivegamsft/sheen mirror.
        required: false

jobs:
  sheen-consumer-sync:
    name: Sync sheen assets and open update PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: sheen-consumer-sync-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - name: Check out consumer repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.update_token || github.token }}

      - name: Resolve sync configuration
        id: config
        shell: bash
        env:
          SHEEN_FETCH_TOKEN: ${{ secrets.fetch_token }}
        run: |
          set -euo pipefail

          # Resolve precedence: explicit workflow input -> .sheen.yml -> public default.
          SOURCE="${{ inputs.source_repo }}"
          REF="${{ inputs.source_ref }}"

          if [[ -f .sheen.yml ]]; then
            YML_SOURCE="$(grep -E '^source:' .sheen.yml | head -1 | sed 's/^source:[[:space:]]*//' | tr -d "\"'")" || true
            YML_REF="$(grep -E '^ref:' .sheen.yml | head -1 | sed 's/^ref:[[:space:]]*//' | tr -d "\"'")" || true
            [[ -z "$SOURCE" && -n "$YML_SOURCE" ]] && SOURCE="$YML_SOURCE"
            [[ -z "$REF" && -n "$YML_REF" ]] && REF="$YML_REF"
          fi

          SOURCE="${SOURCE:-ivegamsft/sheen}"
          REF="${REF:-main}"

          NORMALIZED_SOURCE="${SOURCE#https://github.com/}"
          NORMALIZED_SOURCE="${NORMALIZED_SOURCE%.git}"
          NORMALIZED_SOURCE_LOWER="$(printf '%s' "$NORMALIZED_SOURCE" | tr '[:upper:]' '[:lower:]')"
          if [[ "$NORMALIZED_SOURCE_LOWER" == "ibuyspy-shared/basecoat-sheen" && -z "${SHEEN_FETCH_TOKEN:-}" ]]; then
            echo "::notice title=Using public Sheen mirror::No SHEEN_FETCH_TOKEN was provided for IBuySpy-Shared/basecoat-sheen; using ivegamsft/sheen for asset sync. Provide fetch_token only for private-source overrides."
            SOURCE="ivegamsft/sheen"
            SOURCE_URL="https://github.com/ivegamsft/sheen.git"
          else
            if [[ "$SOURCE" == https://github.com/* ]]; then
              SOURCE="$NORMALIZED_SOURCE"
              SOURCE_URL="https://github.com/${SOURCE}.git"
            elif [[ "$SOURCE" == *://* ]]; then
              SOURCE_URL="$SOURCE"
            else
              SOURCE="$NORMALIZED_SOURCE"
              SOURCE_URL="https://github.com/${SOURCE}.git"
            fi
            if [[ "$NORMALIZED_SOURCE_LOWER" != "ivegamsft/sheen" && -z "${SHEEN_FETCH_TOKEN:-}" ]]; then
              echo "::warning title=Missing Sheen fetch token::source_repo is '${SOURCE}' and no fetch_token was provided. Public sources may still work anonymously; private/internal sources require SHEEN_FETCH_TOKEN or will fail during git clone."
            fi
          fi

          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "source_url=$SOURCE_URL" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

          # Determine branch name for the PR
          SAFE_REF="${REF//\//-}"
          TIMESTAMP="$(date +%Y%m%d%H%M)"
          echo "branch=${{ inputs.pr_branch_prefix }}-${SAFE_REF}-${TIMESTAMP}" >> "$GITHUB_OUTPUT"

      - name: Download sheen sync script
        shell: bash
        run: |
          set -euo pipefail
          # Use existing sync.sh if present, otherwise download from public mirror
          if [[ ! -f sync.sh ]]; then
            curl -fsSL https://raw.githubusercontent.com/ivegamsft/sheen/main/sync.sh -o sync.sh
            chmod +x sync.sh
            echo "Downloaded sync.sh from ivegamsft/sheen"
          else
            echo "Using existing sync.sh"
          fi

      - name: Run sheen sync
        shell: bash
        env:
          SHEEN_REPO: "${{ steps.config.outputs.source_url }}"
          SHEEN_REF: "${{ steps.config.outputs.ref }}"
          SHEEN_FETCH_TOKEN: "${{ secrets.fetch_token }}"
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "github-actions[bot]@users.noreply.github.com"
        run: |
          set -euo pipefail

          # Inject GitHub token into GitHub clone URLs only. Non-GitHub mirrors
          # keep their resolved URL and must rely on their host's auth setup.
          if [[ -n "${SHEEN_FETCH_TOKEN}" && "$SHEEN_REPO" == https://github.com/* ]]; then
            SHEEN_REPO="${SHEEN_REPO/https:\/\/github.com\//https:\/\/x-access-token:${SHEEN_FETCH_TOKEN}@github.com\/}"
          fi

          export SHEEN_REPO SHEEN_REF
          bash sync.sh

      - name: Check for changes
        id: changes
        shell: bash
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No sheen asset changes detected — already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Sheen asset changes detected:"
            git diff --cached --stat
          fi

      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "github-actions[bot]@users.noreply.github.com"
        run: |
          set -euo pipefail
          REF="${{ steps.config.outputs.ref }}"
          MSG="${{ inputs.commit_message }}"
          if [[ -z "$MSG" ]]; then
            MSG="chore(sheen): sync basecoat-sheen @ ${REF}"
          fi
          git checkout -b "${{ steps.config.outputs.branch }}"
          git commit -m "$MSG" \
            -m "Source: ${{ steps.config.outputs.source }} @ ${REF}" \
            -m "Triggered by: ${{ github.actor }} via ${{ github.workflow }}"

      - name: Push sync branch
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.update_token || github.token }}
        run: |
          git push origin "${{ steps.config.outputs.branch }}"

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.update_token || github.token }}
        run: |
          set -euo pipefail
          REF="${{ steps.config.outputs.ref }}"
          DEFAULT_BRANCH="$(gh repo view --json defaultBranchRef --jq '.defaultBranchRef.name')"

          BODY_FILE="$(mktemp)"
          {
            echo "## Sheen asset sync"
            echo ""
            echo "<!-- sheen-consumer-sync-pr:v1 -->"
            echo ""
            echo "Automated sync of basecoat-sheen assets to **${{ steps.config.outputs.ref }}**."
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Source | \`${{ steps.config.outputs.source }}\` |"
            echo "| Ref | \`${{ steps.config.outputs.ref }}\` |"
            echo "| Triggered by | @${{ github.actor }} |"
            echo "| Workflow run | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |"
            echo ""
            echo "### What changed"
            echo "See the commit diff for the full list of synced assets. Assets are governed"
            echo "by the allow-lists in \`.sheen.yml\`."
            echo ""
            echo "### After merging"
            echo "Reset Copilot context to pick up updated skills:"
            echo "- **CLI**: \`exit\` then \`gh copilot\`"
            echo "- **VS Code**: \`Ctrl+Shift+P\` → **Developer: Reload Window**"
            echo "- **JetBrains**: restart editor"
          } > "$BODY_FILE"

          gh pr create \
            --base "$DEFAULT_BRANCH" \
            --head "${{ steps.config.outputs.branch }}" \
            --title "chore(sheen): sync basecoat-sheen @ ${REF}" \
            --body-file "$BODY_FILE"

          if [[ "${{ inputs.auto_merge }}" == "true" ]]; then
            PR_NUMBER="$(gh pr list --head "${{ steps.config.outputs.branch }}" --json number --jq '.[0].number')"
            if [[ -n "$PR_NUMBER" ]]; then
              gh pr merge "$PR_NUMBER" --auto --squash || echo "Auto-merge not available (branch protection may require reviews)"
            fi
          fi

      - name: Report — already up to date
        if: steps.changes.outputs.changed == 'false'
        shell: bash
        run: |
          echo "✅ Sheen assets are already up to date. No PR needed."
          echo "Source: ${{ steps.config.outputs.source }} @ ${{ steps.config.outputs.ref }}"
