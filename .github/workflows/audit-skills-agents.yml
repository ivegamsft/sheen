name: "Sheen - Skills/Agents Audit"

# Runs scripts/audit-skills-agents.ps1 (#131) and files/closes GitHub issues
# for structural findings (broken catalog refs, agent composes.skills[]/
# composes.instructions[] refs, skill "Delegates / pairs with" refs, router
# vocab drift, and eval quality scores below threshold). The PR-blocking
# validate-only pass lives in ci.yml's skills-agents-audit job; this
# workflow is the "create issues" half of the framework and runs on a
# schedule so ambient drift gets tracked even between PRs.

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  audit-and-file-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Install PowerShell
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq powershell

      - name: Audit - skills/agents structural integrity (#131)
        run: pwsh -NonInteractive -File scripts/audit-skills-agents.ps1
        continue-on-error: true

      - name: File / close GitHub issues for findings (#131)
        env:
          GH_TOKEN: ${{ github.token }}
        run: pwsh -NonInteractive -File scripts/file-audit-issues.ps1 -Repo ${{ github.repository }}

      - name: Upload - findings report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skills-agents-findings
          path: dist/audit/skills-agents-findings.json
          retention-days: 30
