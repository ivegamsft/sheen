name: "Sheen - Sync Assets"

# Consumer-side workflow: discover published releases and sync the currently
# installed immutable action version. A discovery run only opens a pin-bump PR;
# the new action version applies on a later run after that PR is merged.
#
# This file was synced into your repo by basecoat-sheen.
# Do not edit directly — changes will be overwritten on the next sync.
# To customise, override inputs below.

on:
  schedule:
    - cron: "0 9 * * 1"

  workflow_dispatch:
    inputs:
      source_ref:
        description: "Optional published vX.Y.Z tag for a pin-bump PR; this run still uses the installed SHA."
        type: string
        required: false
        default: ""
      auto_merge:
        description: "Auto-merge an asset-sync PR if checks pass"
        type: boolean
        required: false
        default: false

  # A pin-bump PR merged with a token that suppresses downstream events needs a
  # manual workflow_dispatch run; otherwise this push applies the new pinned SHA.
  push:
    paths:
      - ".github/workflows/sheen-sync.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sheen-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  discover-release:
    name: Discover release and open pin-bump PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out consumer repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SHEEN_UPDATE_TOKEN || github.token }}

      - name: Resolve public release and render immutable pin
        id: discovery
        # The sync scripts replace both action refs with this checked-out
        # source's commit SHA when installing the managed workflow.
        uses: ivegamsft/sheen/.github/actions/discover-release@v1.3.0
        with:
          desired_tag: ${{ inputs.source_ref || '' }}

      - name: Open release pin-bump PR
        if: steps.discovery.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SHEEN_UPDATE_TOKEN || github.token }}
          GH_PROMPT_DISABLED: "1"
          RELEASE_TAG: ${{ steps.discovery.outputs.release_tag }}
          RELEASE_COMMIT: ${{ steps.discovery.outputs.release_commit }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          branch="chore/sheen-pin-${RELEASE_TAG}"
          open_pr="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$open_pr" ]]; then
            echo "Release pin PR #${open_pr} is already open; no duplicate was created."
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "::error::Branch ${branch} already exists without an open pin PR; refusing to overwrite it."
            exit 1
          fi
          git switch -c "$branch"
          git add -- .github/workflows/sheen-sync.yml
          git diff --cached --quiet && {
            echo "::error::Release discovery reported a change but produced no workflow diff"
            exit 1
          }
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "chore(sheen): pin ${RELEASE_TAG} (${RELEASE_COMMIT:0:12})"
          git push --set-upstream origin "$branch"
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$branch" \
            --title "chore(sheen): pin ${RELEASE_TAG}" \
            --body "Updates the managed sync action to published Sheen release ${RELEASE_TAG} (${RELEASE_COMMIT}). This PR changes only the immutable pin. Assets apply on a later workflow run after this PR is merged."

  sync-assets:
    name: Sync assets from the installed release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out consumer repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SHEEN_UPDATE_TOKEN || github.token }}

      - name: Sync assets from immutable Sheen action
        uses: ivegamsft/sheen/.github/actions/sync-assets@v1.3.0
        with:
          source_commit: v1.3.0

      - name: Check for changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No Sheen asset changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi

      - name: Open asset update PR
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SHEEN_UPDATE_TOKEN || github.token }}
          GH_PROMPT_DISABLED: "1"
          AUTO_MERGE: ${{ inputs.auto_merge || false }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          open_pr="$(gh pr list --state open --limit 100 --json number,title,headRefName --jq '[.[] | select(.title == "chore(sheen): sync pinned assets" or (.headRefName | startswith("chore/sheen-assets-")))] | .[0].number // empty')"
          if [[ -n "$open_pr" ]]; then
            echo "Managed asset-sync PR #${open_pr} is already open; no duplicate was created."
            exit 0
          fi
          branch="chore/sheen-assets-$(date -u +%Y%m%d%H%M%S)"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "::error::Branch ${branch} already exists without an open asset-sync PR; refusing to overwrite it."
            exit 1
          fi
          git switch -c "$branch"
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "chore(sheen): sync pinned basecoat-sheen assets"
          git push --set-upstream origin "$branch"
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$branch" \
            --title "chore(sheen): sync pinned assets" \
            --body "Updates Sheen-managed assets from the immutable action SHA installed in this workflow. Review and merge this PR to apply the pinned release."
          if [[ "$AUTO_MERGE" == "true" ]]; then
            gh pr merge "$branch" --auto --squash --delete-branch
          fi

# For custom or non-Git source repositories, use the documented reusable
# check-sheen-version-callable.yml compatibility workflow instead. That path
# clones the configured source; the default action path does not clone the
# configured source. The public ivegamsft/sheen action needs no fetch token.
