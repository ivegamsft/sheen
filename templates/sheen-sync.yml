name: "Sheen - Sync Assets"

# Consumer-side workflow: checks for sheen updates on a schedule and opens
# a PR when new assets are available. Mirrors the basecoat consumer-update
# experience — updates arrive as governed PRs, not manual script runs.
#
# This file was synced into your repo by basecoat-sheen.
# Do not edit directly — changes will be overwritten on the next sync.
# To customise, override inputs below.

on:
  # Run weekly on Monday morning
  schedule:
    - cron: "0 9 * * 1"

  # Also allow manual trigger from Actions tab
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Sheen ref to sync (tag, branch, or SHA). Defaults to .sheen.yml setting."
        type: string
        required: false
        default: ""
      auto_merge:
        description: "Auto-merge the sync PR if checks pass"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sheen-sync:
    name: Sync sheen assets
    # Pinned to a commit SHA, matching the basecoat consumer-update convention.
    # Production publish rewrites this source-repo reference to ivegamsft/sheen
    # so public consumers can use the same BaseCoat-style onboarding flow.
    # SHA below includes explicit missing-token preflight and source normalization fixes.
    uses: IBuySpy-Shared/basecoat-sheen/.github/workflows/check-sheen-version-callable.yml@a91cfa003551814f064a829a121c1c60e770e6cd
    with:
      # source_repo and source_ref are read from .sheen.yml by default.
      # Override source_repo here to force a source; source_ref can also be
      # overridden via workflow_dispatch input.
      source_ref: ${{ inputs.source_ref || '' }}
      auto_merge: ${{ inputs.auto_merge || false }}
    secrets:
      # update_token: token with contents:write + pull-requests:write
      # Defaults to GITHUB_TOKEN if not provided. Set this secret if you need
      # to trigger further workflows on the resulting PR.
      update_token: ${{ secrets.SHEEN_UPDATE_TOKEN || '' }}
      # fetch_token: read token for private/internal source repositories.
      # Required when .sheen.yml source is IBuySpy-Shared/basecoat-sheen.
      # Not required for the default public ivegamsft/sheen mirror.
      fetch_token: ${{ secrets.SHEEN_FETCH_TOKEN || '' }}
