name: "ux-designer-routing"
description: "Routing and behavior evaluation for agent ux-designer."
skill: "agents/ux-designer.agent.md"
scenarios:
  - id: "pos-journey-interactions"
    input: "Use ux-designer to improve the onboarding journey, interaction states, and usability of our trial signup flow."
    expect_activation: true
  - id: "pos-wireframe-responsive-flow"
    input: "Create wireframes and responsive behavior for a complex form with empty, loading, error, and success states."
    expect_activation: true
  - id: "pos-usability-optimization"
    input: "Evaluate where users abandon the checkout flow and recommend usability optimizations with acceptance criteria."
    expect_activation: true
  - id: "pos-coordinate-ux-skills"
    input: "Coordinate wireframing, UI states, web usability review, and responsive design into one execution plan."
    expect_activation: true
  - id: "neg-brand-standards"
    input: "Codify brand identity principles, logo placement, and imagery style for a launch microsite."
    expect_activation: false
  - id: "neg-taxonomy"
    input: "Build a taxonomy and ontology model for legal documentation and navigation labels."
    expect_activation: false
  - id: "neg-backend-security"
    input: "Write authentication middleware, database migrations, and API authorization tests."
    expect_activation: false
