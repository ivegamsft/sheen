name: "information-architect-routing"
description: "Routing and behavior evaluation for agent information-architect."
skill: "agents/information-architect.agent.md"
scenarios:
  - id: "pos-product-ia-redesign"
    input: "Have information-architect redesign content structure, navigation, taxonomy, and ontology for the partner portal."
    expect_activation: true
  - id: "pos-findability-decision"
    input: "I need an IA decision package for search filters, category labels, and page hierarchy in the knowledge base."
    expect_activation: true
  - id: "pos-taxonomy-ontology-alignment"
    input: "Coordinate taxonomy cleanup with ontology relationships so users can find policies by role, region, and task."
    expect_activation: true
  - id: "pos-navigation-structure"
    input: "Plan a navigation restructure and content model for settings without touching visual styling first."
    expect_activation: true
  - id: "neg-token-theming"
    input: "Create semantic color tokens and high-contrast theme overrides for our component library."
    expect_activation: false
  - id: "neg-usability-wireframes"
    input: "Sketch mobile wireframes and interaction states for checkout error recovery."
    expect_activation: false
  - id: "neg-infrastructure"
    input: "Provision cloud networking, database backups, and deployment automation for production."
    expect_activation: false
