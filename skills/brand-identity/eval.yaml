name: "brand-identity-routing"
description: "Routing evaluation — validates trigger activation for brand-identity."
skill: "skills/brand-identity/SKILL.md"
scenarios:
  - id: "pos-principles"
    input: "Define brand principles for a B2B analytics product so teams can judge future UI and content decisions."
    expect_activation: true
  - id: "pos-visual-codification"
    input: "Codify visual identity rules for color mood, imagery style, and product moments in a redesign brief."
    expect_activation: true
  - id: "pos-consistency-guidance"
    input: "Review three feature concepts for brand consistency and document approved patterns and anti-patterns."
    expect_activation: true
  - id: "pos-identity-rollout"
    input: "Create rollout guidance that translates our brand identity into concrete examples for dashboards and onboarding."
    expect_activation: true
  - id: "neg-microcopy"
    input: "Edit microcopy for empty states and notification tone without changing visual identity rules."
    expect_activation: false
  - id: "neg-component-redlines"
    input: "Write component redline specs with anatomy, variants, focus states, and token mappings."
    expect_activation: false
  - id: "neg-ia-taxonomy"
    input: "Create a navigation taxonomy and ontology model for support documentation."
    expect_activation: false
