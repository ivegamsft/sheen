name: "theming-routing"
description: "Routing evaluation — validates trigger activation for theming."
skill: "skills/theming/SKILL.md"
scenarios:
  - id: "pos-new-theme"
    input: "Create a new partner theme with light, dark, and high-contrast values mapped to existing semantic tokens."
    expect_activation: true
  - id: "pos-semantic-overrides"
    input: "Define semantic overrides for a branded theme while preserving existing color roles and migration guidance."
    expect_activation: true
  - id: "pos-theme-completeness"
    input: "Validate theme completeness across surface, text, border, and status roles before release."
    expect_activation: true
  - id: "pos-cross-theme-mapping"
    input: "Produce cross-theme mappings and exception notes for high-contrast and dark mode adoption."
    expect_activation: true
  - id: "neg-new-semantic-key"
    input: "Invent a new semantic token key and update the primitive token schema."
    expect_activation: false
  - id: "neg-brand-voice"
    input: "Create brand voice guidelines and messaging style rules for product notifications."
    expect_activation: false
  - id: "neg-accessibility-audit"
    input: "Run a full WCAG audit of keyboard navigation, ARIA labels, and screen reader announcements."
    expect_activation: false
