name: "design-review-routing"
description: "Routing evaluation — validates trigger activation for design-review."
skill: "skills/design-review/SKILL.md"
scenarios:
  - id: "pos-artifact-critique"
    input: "Review this checkout mock against our design principles and identify craft issues before handoff."
    expect_activation: true
  - id: "pos-governance-findings"
    input: "Run a principle-based review of the account settings flow and record findings with severity and remediation owners."
    expect_activation: true
  - id: "pos-single-flow-review"
    input: "Critique one proposed dashboard layout for policy, hierarchy, consistency, and approval risks."
    expect_activation: true
  - id: "pos-governed-craft-findings"
    input: "Review this Figma-ready artifact against design governance rules and severity-rank any craft or policy issues without opening a multi-option debate."
    expect_activation: true
  - id: "pos-real-content-calibration"
    input: "Review this claims-intake form using real customer-representative data shapes, marking any invented sample content, and exercise the empty, error, and loading states."
    expect_activation: true
  - id: "pos-visual-self-critique"
    input: "Capture a rendered screenshot of the updated dashboard, critique its hierarchy, density, and overflow, then make one focused revision pass and record what changed."
    expect_activation: true
  - id: "neg-debate-facilitation"
    input: "Compare three competing design directions and facilitate final arbitration with stakeholders."
    expect_activation: false
  - id: "neg-full-repo-audit"
    input: "Audit the entire repository for design-system drift, token usage, and visual regression risks."
    expect_activation: false
  - id: "neg-implementation"
    input: "Build the approved component in TypeScript and add unit tests."
    expect_activation: false
  - id: "neg-aesthetic-direction-generation"
    input: "Generate the AESTHETIC-DIRECTION.md creative-direction narrative from our design tokens without reviewing any specific artifact."
    expect_activation: false
  - id: "neg-snapshot-baseline-setup"
    input: "Set up the initial Playwright snapshot baselines for our diagram renders before any design critique happens."
    expect_activation: false
  - id: "neg-craft-only-polish-pass"
    input: "Run only a typography, spacing, refinement, and fit-and-finish polish pass with a craft checklist; no governance severity report is needed."
    expect_activation: false
