name: "design-adoption-telemetry-routing"
description: "Routing evaluation — validates trigger activation for design-adoption-telemetry."
skill: "skills/design-adoption-telemetry/SKILL.md"
scenarios:
  - id: "pos-1"
    input: "Generate a token coverage report for src/ showing which semantic tokens are used versus hardcoded"
    expect_activation: true
  - id: "pos-2"
    input: "Produce a Q3 design system adoption scorecard broken down by team and product area"
    expect_activation: true
  - id: "pos-3"
    input: "Identify which files in the codebase have the highest density of hardcoded colour values"
    expect_activation: true
  - id: "pos-4"
    input: "Find all references to deprecated tokens still in use across the production codebase"
    expect_activation: true
  - id: "neg-1"
    input: "Set up a Datadog dashboard to track API error rates and p99 response latency"
    expect_activation: false
  - id: "neg-2"
    input: "Instrument the React app with Segment analytics to measure feature adoption by users"
    expect_activation: false