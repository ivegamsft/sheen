name: "component-spec-routing"
description: "Routing evaluation — validates trigger activation for component-spec."
skill: "skills/component-spec/SKILL.md"
scenarios:
  - id: "pos-1"
    input: "Write a complete component spec for a segmented control with states and keyboard behavior."
    expect_activation: true
  - id: "pos-2"
    input: "Define anatomy, variants, and token mappings for a dialog component."
    expect_activation: true
  - id: "pos-3"
    input: "Create a spec for a button family including ARIA and focus model."
    expect_activation: true
  - id: "pos-4"
    input: "Check whether a spec already exists for the checkbox component before writing a new one."
    expect_activation: true
  - id: "neg-1"
    input: "Audit the entire product for design debt and rank findings."
    expect_activation: false
  - id: "neg-2"
    input: "Generate a new brand palette and semantic role colors."
    expect_activation: false

