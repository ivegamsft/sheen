name: "secure-ux-routing"
description: "Routing evaluation — validates trigger activation for secure-ux."
skill: "skills/secure-ux/SKILL.md"
scenarios:
  - id: "pos-auth-consent"
    input: "Harden the auth and consent UX so permission prompts are clear, reversible, and least-privilege."
    expect_activation: true
  - id: "pos-safe-error-states"
    input: "Design safe error states for password reset that avoid account enumeration and sensitive internal details."
    expect_activation: true
  - id: "pos-privacy-feedback"
    input: "Review input feedback and confirmation copy for privacy safety before users submit personal data."
    expect_activation: true
  - id: "pos-abuse-case-flow"
    input: "Map abuse cases in a billing cancellation flow and recommend secure UX defaults for risky actions."
    expect_activation: true
  - id: "neg-threat-model"
    input: "Perform backend threat modeling for API authorization, secrets handling, and service-to-service trust boundaries."
    expect_activation: false
  - id: "neg-penetration-test"
    input: "Run penetration testing and exploit validation against the deployed application."
    expect_activation: false
  - id: "neg-brand-copy"
    input: "Rewrite onboarding copy to sound more playful and aligned with brand tone."
    expect_activation: false
