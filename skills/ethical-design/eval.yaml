id: ethical-design
description: Routes dark pattern detection and consent UI audits to ethical-design skill
threshold: 7.0
cases:
  - input: "audit this checkout flow for dark patterns"
    expected_skill: ethical-design
    score: 9.5
    rationale: Dark pattern audit is the primary use case
  - input: "is our cookie consent dialog GDPR-compliant?"
    expected_skill: ethical-design
    score: 9.0
    rationale: Consent UI GDPR review is a core capability
  - input: "our cancel flow takes 3 screens — is this a roach motel?"
    expected_skill: ethical-design
    score: 9.0
    rationale: Roach motel pattern detection
  - input: "suggest an ethical alternative to this confirmshaming button"
    expected_skill: ethical-design
    score: 8.5
    rationale: Ethical alternative recommendation
  - input: "review the privacy policy text for legal compliance"
    expected_skill: governance
    score: 2.0
    rationale: Legal text review is not ethical design
  - input: "penetration test the consent API endpoint"
    expected_skill: penetration-testing
    score: 2.0
    rationale: Security testing is not ethical UX design
