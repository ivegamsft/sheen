    input: "Create grid columns, gutters, and max-width rules for a responsive marketing and app shell layout."
    expect_activation: true
  - id: "pos-breakpoint-planning"
    input: "Plan breakpoint behavior for dense admin pages, including container widths and spacing exceptions."
    expect_activation: true
  - id: "pos-foundation-migration"
    input: "Normalize layout primitives and publish migration notes for spacing, grid, and gutter adoption."
    expect_activation: true
  - id: "neg-responsive-qa"
    input: "Test one screen at mobile widths and file responsive QA bugs for visual regressions."
    expect_activation: false
  - id: "neg-component-anatomy"
    input: "Write a component anatomy spec with variants, ARIA roles, and keyboard behavior."
    expect_activation: false
  - id: "neg-service-code"
    input: "Implement server-side caching and database indexes for reporting endpoints."
    expect_activation: false
